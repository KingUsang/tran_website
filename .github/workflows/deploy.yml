
name: Deploy to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production code
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir -p deploy

          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.wrangler/' \
            --exclude='/.wrangler-config/' \
            --exclude='/functions/' \
            --exclude='/inspiration/' \
            --exclude='/screenshot_tool/' \
            --exclude='**/node_modules/' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='*.md' \
            --exclude='*.docx' \
            --exclude='*.pdf' \
            --exclude='*.py' \
            --exclude='recover*.js' \
            --exclude='/wrangler.jsonc' \
            --exclude='/config.toml' \
            --exclude='/_redirects' \
            --exclude='/default.php' \
            --exclude='/submit.php' \
            --exclude='/.gitignore' \
            --exclude='/deploy/' \
            ./ deploy/

          cat > deploy/.htaccess <<'EOF'
          RewriteEngine On

          RewriteRule ^programs/?$ /impact/ [R=301,L]
          RewriteRule ^get-involved/?$ https://ubuntubridgeinitiatives.org/ [R=301,L]
          RewriteRule ^cytrac/?$ https://www.cytracgames.com/ [R=301,L]
          RewriteRule ^ubuntu-bridge/?$ https://ubuntubridgeinitiatives.org/ [R=301,L]
          RewriteRule ^contact/?$ /partner-with-us/ [R=301,L]
          EOF

      - name: Upload website files
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.IONOS_SFTP_HOST }}
          username: ${{ secrets.IONOS_SFTP_USER }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          port: 22
          local_path: './deploy/*'
          remote_path: '/'
          sftp_only: true
          delete_remote_files: false

      - name: Upload Apache redirects
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.IONOS_SFTP_HOST }}
          username: ${{ secrets.IONOS_SFTP_USER }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          port: 22
          local_path: './deploy/.htaccess'
          remote_path: '/'
          sftp_only: true
          delete_remote_files: false
